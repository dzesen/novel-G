# LLM 大模型配置
# 每个 provider 条目的 key 是用户自定义的别名，type 指定客户端类别（openai / gemini / claude）
# 同一个 type 可以定义多个不同别名的配置，方便在不同场景使用不同模型
# 每个 provider 可选配置生成参数默认值（temperature / top_p / max_tokens / system_prompt 等），
# 请求级别的参数会覆盖 provider 级别的默认值
llm:
  default_provider: openai_gpt4o_mini
  # Stage 2 tagged policy：disabled 表示关闭，provider 表示固定别名。
  format_review:
    mode: disabled
    provider_alias: null
  # 客户端断开时，是否把已完成步骤的完整结果打进日志。
  # 无论开关如何，断开都会立即取消正在跑的 LLM 调用——否则关了页面照样计费。
  # 默认关闭：整段剧情文本会让日志迅速膨胀，且前端本就带 cached_steps 续跑。
  log_partial_result_on_disconnect: false
  providers:
    openai_gpt4o_mini:
      type: openai
      base_url: "https://api.openai.com"
      api_key: ""
      default_model: "gpt-4o-mini"
      enabled: false
      timeout_seconds: 60
      max_retries: 2
      max_concurrency: 5
      use_system_proxy: false
      supports_streaming: true
      structured_output: schema_enforced
      max_context_tokens: 128000
      supports_function_calling: true
      # 流式响应是否回报 token 用量（仅 openai 类型需要）。开启后请求会带
      # stream_options={"include_usage": true}，官方 API 支持；若把 base_url
      # 改指到不认该参数的第三方兼容端点，需改回 false。
      supports_stream_usage: true
      # 交互式正文完成验收会在付费确认前展示费用上界。使用该 Provider 时，
      # 以下四项必须成组配置；价格不会由系统联网猜测或自动刷新。
      # billing_currency: USD
      # input_cost_per_million_tokens: 0.15
      # output_cost_per_million_tokens: 0.60
      # pricing_basis: "2026-08-25 官方价目表，按无缓存输入计费"
      # 生成参数默认值（可选，不设置则由模型自行决定）
      # temperature: 0.7
      # top_p: 0.9
      # max_tokens: 4096
      # system_prompt: ""
      # presence_penalty: 0.0
      # frequency_penalty: 0.0
    deepseek_chat:
      type: openai
      base_url: "https://api.deepseek.com"
      api_key: ""
      default_model: "deepseek-chat"
      enabled: false
      timeout_seconds: 60
      max_retries: 2
      max_concurrency: 5
      use_system_proxy: false
      supports_streaming: true
      structured_output: prompt_json
      max_context_tokens: 64000
      supports_function_calling: true
      # 第三方兼容端点默认关闭：不确认支持 stream_options 就发，会打断本来能跑的流式。
      # 确认端点支持后改 true，即可统计流式 token 用量。
      supports_stream_usage: false
    gemini_flash:
      type: gemini
      base_url: ""
      api_key: ""
      default_model: "gemini-3.1-flash-lite-preview"
      enabled: false
      timeout_seconds: 60
      max_retries: 2
      max_concurrency: 5
      use_system_proxy: false
      supports_streaming: true
      structured_output: schema_enforced
      max_context_tokens: 128000
      supports_function_calling: true
    claude_sonnet:
      type: claude
      base_url: ""
      api_key: ""
      default_model: "claude-sonnet-4-20250514"
      enabled: false
      timeout_seconds: 60
      max_retries: 2
      max_concurrency: 5
      use_system_proxy: false
      supports_streaming: true
      structured_output: schema_enforced
      max_context_tokens: 128000
      supports_function_calling: true
  # 在这里定义不同的工作流，每个工作流指定默认使用哪个 provider，以及每个步骤使用哪个 provider
  workflows:
    create_novel_by_ai:
      default_provider: ""
      steps:
        expand_idea_to_full_novel_story:
          provider: ""
          timeout_seconds: null
        extract_idea:
          provider: ""
          timeout_seconds: null
        core_seed:
          provider: ""
          timeout_seconds: null
        novel_meta:
          provider: ""
