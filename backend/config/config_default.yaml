# Default configuration for the application
# You can override these settings by creating a config.yaml file in the same directory
# Do not edit this file directly, as it may be overwritten during updates
"mongodb_url": "mongodb://localhost:27017"
"mongo_database_name": "my_database"
"mongo_timeout_ms": 5000
"mongo_transaction_mode": "auto"

# 本地自动备份：启动时若距离上次备份超过 interval_hours，则保存完整数据快照。
backup:
  enabled: true
  interval_hours: 24
  retention_count: 10
  directory: "backups"

# LLM 大模型配置
# 每个 provider 条目的 key 是用户自定义的别名，type 指定客户端类别（openai / gemini / claude）
# 同一个 type 可以定义多个不同别名的配置，方便在不同场景使用不同模型
# 每个 provider 可选配置生成参数默认值（temperature / top_p / max_tokens / system_prompt 等），
# 请求级别的参数会覆盖 provider 级别的默认值
llm:
  default_provider: openai_gpt4o_mini
  format_review_provider: openai_gpt5_4_nano
  # 客户端断开时，是否把已完成步骤的完整结果打进日志。
  # 无论开关如何，断开都会立即取消正在跑的 LLM 调用——否则关了页面照样计费。
  # 默认关闭：整段剧情文本会让日志迅速膨胀，且前端本就带 cached_steps 续跑。
  log_partial_result_on_disconnect: false
  providers:
    openai_gpt4o_mini:
      type: openai
      base_url: "https://api.openai.com"
      api_key: ""
      default_model: "gpt-4o-mini"
      enabled: false
      timeout_seconds: 60
      max_retries: 2
      max_concurrency: 5
      use_system_proxy: false
      supports_streaming: true
      supports_json_schema: true
      supports_function_calling: true
      # 流式响应是否回报 token 用量（仅 openai 类型需要）。开启后请求会带
      # stream_options={"include_usage": true}，官方 API 支持；若把 base_url
      # 改指到不认该参数的第三方兼容端点，需改回 false。
      supports_stream_usage: true
      # 生成参数默认值（可选，不设置则由模型自行决定）
      # temperature: 0.7
      # top_p: 0.9
      # max_tokens: 4096
      # system_prompt: ""
      # presence_penalty: 0.0
      # frequency_penalty: 0.0
    deepseek_chat:
      type: openai
      base_url: "https://api.deepseek.com"
      api_key: ""
      default_model: "deepseek-chat"
      enabled: false
      timeout_seconds: 60
      max_retries: 2
      max_concurrency: 5
      use_system_proxy: false
      supports_streaming: true
      supports_json_schema: true
      supports_function_calling: true
      # 第三方兼容端点默认关闭：不确认支持 stream_options 就发，会打断本来能跑的流式。
      # 确认端点支持后改 true，即可统计流式 token 用量。
      supports_stream_usage: false
    gemini_flash:
      type: gemini
      base_url: ""
      api_key: ""
      default_model: "gemini-3.1-flash-lite-preview"
      enabled: false
      timeout_seconds: 60
      max_retries: 2
      max_concurrency: 5
      use_system_proxy: false
      supports_streaming: true
      supports_json_schema: true
      supports_function_calling: true
    claude_sonnet:
      type: claude
      base_url: ""
      api_key: ""
      default_model: "claude-sonnet-4-20250514"
      enabled: false
      timeout_seconds: 60
      max_retries: 2
      max_concurrency: 5
      use_system_proxy: false
      supports_streaming: true
      supports_json_schema: true
      supports_function_calling: true
  # 在这里定义不同的工作流，每个工作流指定默认使用哪个 provider，以及每个步骤使用哪个 provider
  workflows:
    create_novel_by_ai:
      default_provider: openai_gpt4o_mini
      steps:
        expand_idea_to_full_novel_story:
          provider: openai_gpt4o_mini
          timeout_seconds: null
        extract_idea:
          provider: openai_gpt4o_mini
          timeout_seconds: null
        core_seed:
          provider: openai_gpt4o_mini
          timeout_seconds: null
        novel_meta:
          provider: openai_gpt4o_mini
          timeout_seconds: null
    create_factions_by_ai:
      default_provider: openai_gpt4o_mini
      steps:
        create_core_factions:
          provider: openai_gpt4o_mini
          timeout_seconds: null
    create_volume_outline_by_ai:
      default_provider: openai_gpt4o_mini
      steps:
        volume_outline:
          provider: openai_gpt4o_mini
          timeout_seconds: null
    create_chapter_outline_by_ai:
      default_provider: openai_gpt4o_mini
      steps:
        chapter_outline:
          provider: openai_gpt4o_mini
          timeout_seconds: null
    write_chapter_by_ai:
      default_provider: openai_gpt4o_mini
      steps:
        chapter_content:
          provider: openai_gpt4o_mini
          timeout_seconds: null
    extract_chapter_state_by_ai:
      default_provider: openai_gpt4o_mini
      steps:
        chapter_state:
          provider: openai_gpt4o_mini
          timeout_seconds: null
