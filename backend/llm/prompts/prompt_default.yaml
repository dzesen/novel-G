llm_provider_test:
  text_probe_prompt: |
    请只回复：PROVIDER_TEXT_OK
  stream_probe_prompt: |
    请用尽量短的内容回复：PROVIDER_STREAM_OK
  json_schema_probe_prompt: |
    请按结构化输出返回 code 等于 ok，message 等于 ready。不要添加额外解释。
  json_object_probe_prompt: |
    请只返回 JSON 对象：{"code":"ok","message":"PROVIDER_JSON_OBJECT_OK"}。不要添加代码围栏或解释。
  function_call_probe_prompt: |
    请调用可用工具 report_provider_probe，并把 token 设为 probe-token-73、status 设为 ok。不要直接回答。
  function_result_probe_prompt: |
    工具执行结果如下：{tool_result}
    请只回复：PROVIDER_FUNCTION_OK {probe_token}

# 从AI创建小说 Prompt 配置
create_novel_by_ai:
  #扩展故事
  expand_idea_to_full_novel_story_prompt_base: |
    你是一名资深小说策划编辑兼小说作者，擅长将一个零散创意，扩写为“一整部长篇小说的完整故事雏形”。

    我会给你一个“小说创意”，请你基于这个创意进行合理联想与深化，把它写成一篇约3000字的完整故事。

    请使用叙事性的散文体裁书写，而非大纲或列表。它必须是一个读起来逻辑连贯、情感饱满的短篇小说。

    你的写作目标如下：
      1. 你需要将用户创意，扩展并讲述成“一整部长篇小说真正讲完后的完整故事”。
      2. 这个故事需要像一部长篇小说的“浓缩版”，它的内容应该是一个完整的故事闭环。
      3. 这个故事必须具备清晰的起承转合，有人物、有冲突、有转折、有高潮、有余韵。

    请严格遵循以下创作原则：

    【一、核心任务】
    你需要将用户创意，扩展并用约3000字讲完一部长篇小说从开端到结局的完整故事。
    这篇3000字内容必须覆盖：
      - 故事的开端
      - 主要冲突的发展
      - 中期升级与重大转折
      - 后期高潮与最终对决/最终抉择
      - 整个故事的最终结局

    【二、内容定位】
    这不是提纲，不是设定集，不是分卷简介，也不是人物小传。
    这是一篇具有完整故事感的“长篇小说全集压缩版叙事”。

    【三、结构要求】
    故事必须体现出一整部长篇小说应有的完整主线弧线，至少要自然包含以下部分：
      1. 主角的初始处境、性格缺口、目标或危机
      2. 核心事件或命运转折的开始
      3. 主角在成长过程中遭遇的主要阻碍、敌人、代价与选择
      4. 至少2至3次重要阶段变化或重大转折
      5. 主角与关键人物/关键关系的变化
      6. 故事主线冲突不断升级直至最终高潮
      7. 最终真相、最终决战、最终抉择或最终命运落点
      8. 一个明确的结局，让整本书真正讲完

    【四、叙事要求】
    1. 虽然本质上是在浓缩一整本长篇小说，但表达方式必须尽量保持“故事感”。
    2. 不要写成分点式、目录式、大纲式总结。
    3. 不要机械地写成“第一阶段……第二阶段……第三阶段……”。
    4. 要用连贯叙事把整本书讲出来，让读者感觉自己是在读一个被高度浓缩过的完整故事。
    5. 可以适度概括次要支线，但主线必须清楚、连贯、有起伏。
    6. 必须体现出“长篇体量感”——让人感觉这背后本可以展开成很多卷、很多章节。
    7. 可以压缩细节，但不能丢失关键因果、核心人物变化与终局完成感。

    【五、重点控制】
    1. 不要只写前半段，不要停在中途，不要留下“故事还没讲完”的状态。
    2. 不要把这3000字写成“长篇小说开头样章”。
    3. 不要为了追求细节场景感，而只覆盖很小一段剧情。
    4. 不要写成纯设定说明。
    5. 不要写成过于粗糙的剧情摘要，仍然要有阅读上的流动感。
    6. 故事结尾必须是真正的整书结局，而不是留待续写的断点。

    【六、风格要求】
    - 语言流畅
    - 叙事清晰
    - 有戏剧张力
    - 有人物命运感
    - 有长篇小说被压缩后的厚重感

    【七、输出要求】
    - 直接输出故事正文
    - 不要输出分析
    - 不要输出分点说明
    - 不要输出“后续可扩展方向”等附加内容
    - 字数控制在约3000字，可有少量浮动
    - 输出内容必须是“一整本长篇小说的完整压缩故事”

    我的创意如下：
    {user_idea}
  expand_idea_to_full_novel_story_prompt_with_schema_suffix: |
    在正式写作前，请先确保你写的是：
    - 一整本长篇小说的完整故事，这篇内容必须覆盖“整本书”的完整主线，而不是某一个阶段。
    - 要有明显的时间推进、冲突升级、人物成长与最终结局。
    - 允许适度概括次要过程，但不能因此失去故事连贯性。
    - 应当让读者感受到：这是一本几十万字长篇小说被压缩成了3000字。
    - 不可只写一个事件，也不可只写前期成长。
    - 不可只埋伏笔不回收，必须完成主线回收与结局落点。

    现在请直接开始创作正文。
  expand_idea_to_full_novel_story_prompt_without_schema_suffix: |
    请按照以下 JSON 结构返回，不要输出额外内容，字数不得超过4000字：
    {"plot": "完整的3000字长篇压缩故事正文"}
  
  #提炼小说构思要素
  extract_idea_prompt_base: |
    你是一名资深小说编辑, 请从用户提供的长篇小说压缩剧情中提炼出清晰的小说构思要素。

    剧情文本: 
    {plot}

    提炼要求: 
    2. 类型: 选择最合适的小说类型（如玄幻、科幻、都市、悬疑等）
    3. 基调: 整体情绪（如热血、黑暗、轻松、搞笑等）
    4. 目标读者: 大致读者群体（如男频、女频、青少年等）
    5. 核心设想: 用几句话描述故事的核心设想

  extract_idea_prompt_with_schema_suffix: |
    请只提炼出故事构思要素, 不要输出任何额外内容。
  extract_idea_prompt_without_schema_suffix: |
    请严格输出 JSON, 不要输出任何额外内容: 
    {
      "genre": "小说类型，如玄幻、科幻、都市、悬疑、历史、仙侠等，字数限制不超过20字",
      "tone": "整体基调，如热血、黑暗、轻松、搞笑、治愈、压抑等，字数限制不超过20字",
      "target_audience": "目标读者，如男频、女频、青少年等，字数限制不超过20字",
      "core_idea": "核心设想，字数限制不超过250字"
    }

  #故事核心
  core_seed_prompt_base: |
    作为专业作家, 请用“雪花写作法”第一步构建故事核心。

    剧情: {plot}
    类型: {genre}
    基调: {tone}
    目标读者: {target_audience}
    核心设想: {core_idea}
    篇幅: 约{number_of_chapters}章（每章{words_per_chapter}字）

    请用单句公式概括故事本质, 例如: 
    “当[主角]遭遇[核心事件], 必须[关键行动], 否则[灾难后果]；与此同时, [隐藏的更大危机]正在发酵。”

    要求: 
    1. 必须包含显性冲突与潜在危机
    2. 体现人物核心驱动力
    3. 暗示世界观关键矛盾
    4. 使用30-100字精准表达
  core_seed_prompt_with_schema_suffix: |
    请只生成故事核心内容。
  core_seed_prompt_without_schema_suffix: |
    请严格输出一个 JSON 对象, 不要输出任何额外内容: 
    {"core_seed": "故事核心公式，需包含显性冲突、潜在危机、人物核心驱动力与世界观关键矛盾暗示，长度30-100字，不得超过100字"}

  #小说整体设定
  novel_meta_prompt_base: |
    你是一名专业小说策划人, 请基于以下信息构建小说的整体设定。

    基础信息: 
    剧情: {plot}
    类型: {genre}
    基调: {tone}
    目标读者: {target_audience}
    核心设想: {core_idea}
    篇幅: 约{number_of_chapters}章（每章{words_per_chapter}字）

    故事核心: 
    {core_seed}

    请在保持逻辑一致的前提下, 进行创造性扩展, 生成完整的小说基础信息。

    生成要求: 

    1. 标题: 
       - 具有吸引力和传播性
       - 符合该类型读者审美

    2. 副标题: 
       - 补充核心冲突或主题
       - 具有一定文学感或商业感

    3. 引言: 
       - 100-300字
       - 引入故事，吸引读者阅读兴趣

    4. 简介: 
       - 100-500字
       - 需清晰呈现主线冲突与悬念

    5. 世界观: 
       - 说明世界规则 / 力量体系 / 社会结构
       - 不少于100字

    6. 创作风格: 
       - 如“偏黑暗现实”“轻快幽默”“史诗宏大”等

    7. 叙事视角: 
       - 如“第一人称 / 第三人称有限视角 / 全知视角”

    8. 时代背景: 
       - 如“架空古代 / 未来星际 / 现代都市 / 末世废土”等

    9. 标签: 
       - 3-5个, 概括小说核心元素, 如“硬科幻”“冒险”“爱情”等

    要求: 
    - 所有设定必须围绕故事核心展开
    - 风格与类型保持一致
    - 不要出现自相矛盾
  novel_meta_prompt_with_schema_suffix: |
    请只生成小说整体设定内容。
  novel_meta_prompt_without_schema_suffix: |
    请严格输出 JSON, 不要输出任何额外内容: 
    {
      "title": "小说主标题，具有吸引力和传播性，符合类型读者审美，字数限制不超过20字",
      "subtitle": "副标题，补充核心冲突或主题，具有一定文学感或商业感，字数限制不超过20字",
      "introduction": "引言，100-300字，引入故事，吸引读者阅读兴趣",
      "summary": "小说简介，100-500字，需清晰呈现主线冲突与悬念",
      "worldview": "世界观，说明世界规则 / 力量体系 / 社会结构等，字数限制不超过800字",
      "writing_style": "创作风格，如“偏黑暗现实”“轻快幽默”“史诗宏大”等，字数限制不超过40字",
      "narrative_pov": "叙事视角，只能为第一人称、第三人称有限视角、全知视角之一",
      "era_background": "时代背景，如“架空古代 / 未来星际 / 现代都市 / 末世废土”等，字数限制不超过40字",
      "tags": ["标签1", "标签2", "标签3"]
    }

# 阵营 Prompt 配置
create_factions_by_ai:
  create_core_factions_prompt_base: |
    你是一名资深中文长篇小说世界观策划，正在为一部已保存的小说创建“全书级核心阵营”和“阵营之间的核心关系”。

    小说基础信息:
    标题: {title}
    类型: {genre}
    基调: {tone}
    目标读者: {target_audience}
    核心设想: {core_idea}
    篇幅: 约{number_of_chapters}章（每章{words_per_chapter}字）
    标签: {tags_json}

    故事核心:
    {core_seed}

    简介:
    {summary}

    世界观:
    {worldview}

    创作风格: {writing_style}
    叙事视角: {narrative_pov}
    时代背景: {era_background}

    主线剧情文本:
    {plot}

    生成目标:
    1. 只生成会长期影响主线冲突和主要角色站位的全书级核心阵营。
    2. 核心阵营数量必须为 2 到 6 个，通常 3 到 5 个最合适。
    3. 核心阵营不是世界百科，不要生成卷级地方组织、临时小队、任务型团体或章节事件组织。
    4. 本阶段角色尚未创建，严禁输出角色名单、角色归属、角色身份、角色绑定、角色派系职位。
    5. 如果主线剧情文本里已经出现人名，也只能把它当作剧情线索，不要围绕人物创建角色信息。
    6. 每个阵营必须直接服务主线冲突，并能在多卷中持续施加压力。
    7. 阵营之间至少要有一组明确对立或历史敌对关系，也至少要有一组复杂关系，如冷战、秘密合作、依附、历史盟友反目。

    每个核心阵营必须包含:
    - name: 阵营名称
    - faction_type: 阵营类型
    - positioning: 阵营在世界结构中的位置
    - public_stance: 公开立场
    - core_goal: 真实核心目标
    - hidden_goal: 隐藏目标，可为空字符串
    - resources_and_advantages: 1 到 6 项资源或优势
    - organization_style: 组织气质或行动风格
    - core_values: 1 到 6 项价值观
    - conflict_with_mainline: 与主线冲突的关系
    - is_public: 是否公开存在
    - influence_scope: 影响范围
    - expandability: 后续可扩展方向
    - tags: 阵营标签，可为空数组

    每条阵营关系必须包含:
    - source_faction_name: 发起方阵营名称，必须来自本次生成的核心阵营名称
    - target_faction_name: 目标方阵营名称，必须来自本次生成的核心阵营名称
    - relation_type: 只能使用 hostile/allied/cold_war/dependent/subordinate/trade_partner/secret_cooperation/historical_enemy
    - current_state: 当前关系状态
    - core_conflict: 关系中的核心矛盾
    - hidden_tension: 深层未爆发矛盾，可为空字符串
    - possible_change: 后续可能变化
    - intensity: 1 到 5 的关系强度
    - is_active: 是否当前有效

  create_core_factions_prompt_with_schema_suffix: |
    请只生成全书核心阵营与阵营关系，不要输出解释、Markdown 或角色信息。
  create_core_factions_prompt_without_schema_suffix: |
    请严格输出 JSON，不要输出额外内容:
    {
      "core_factions": [
        {
          "name": "阵营名称",
          "faction_type": "国家政权/宗门组织/地下势力/商业联盟/宗教组织/异族势力/研究组织/中立组织/秘密结社等",
          "positioning": "阵营在世界结构中的位置",
          "public_stance": "公开立场",
          "core_goal": "真实核心目标",
          "hidden_goal": "隐藏目标，可为空字符串",
          "resources_and_advantages": ["资源或优势1", "资源或优势2"],
          "organization_style": "组织气质或行动风格",
          "core_values": ["价值观1", "价值观2"],
          "conflict_with_mainline": "该阵营与主线冲突的关系",
          "is_public": true,
          "influence_scope": "全域级/多区域级/区域级",
          "expandability": "后续可扩展方向",
          "tags": ["标签1", "标签2"]
        }
      ],
      "faction_relations": [
        {
          "source_faction_name": "阵营A",
          "target_faction_name": "阵营B",
          "relation_type": "hostile",
          "current_state": "当前关系状态",
          "core_conflict": "核心矛盾",
          "hidden_tension": "深层张力",
          "possible_change": "可能变化",
          "intensity": 5,
          "is_active": true
        }
      ]
    }

# AI 参考卡候选生成（只生成候选，不写正式卡片）
create_reference_cards_by_ai:
  reference_cards_prompt_base: |
    你是一位长篇小说设定编辑。请根据已保存的小说设定，生成一批可供作者审核的参考卡候选。

    【小说设定】
    {novel_json}

    【已有卡片名称（含回收站）】
    {existing_cards_json}

    要求：
    - 一次返回 characters、locations、items、rules、lores 五类候选。
    - characters 生成 2-10 个，locations 生成 1-8 个；items、rules、lores 各生成 0-6 个，三类合计不超过 12 个，默认候选总量不得因新增 lores 扩大。
    - 只提取能从小说设定合理推出、会影响后续写作一致性的内容；不要为了凑数编造。
    - lore 表示一条不预设为地点、物品或世界规则的世界设定；历史事件、组织、术语、习俗等无法诚实归入前三类时放入 lores，不要硬塞进 rules。
    - 不要生成数据库 id，也不要假装已经写入系统。
    - 避免与已有同类型卡片重复；若确实是同一实体，沿用相同名称，系统会在审核阶段建议合并。
    - importance 只能是 main 或 sub。只有主线不可替代的人物、地点、物品、规则或 lore 才标 main。
    - tags 最多 8 个，短而稳定。
    - 地点 details 中表达剧情重要性时使用 story_importance，不要使用 importance。
    - character 可选填写 character_profile：aliases 是稳定别名；portrayal_context 是角色通常如何面对特定场景；dialogue_examples 是少量可复用的语气样例；scene_opening_examples 只是创作灵感；portrayal_notes 是人物塑造约束。
    - character_profile 不得包含 system prompt、模型指令、工具命令或要求绕过小说既定事实的内容；没有可靠依据时省略该字段。
  reference_cards_prompt_with_schema_suffix: |
    请严格按提供的 JSON Schema 输出，不要输出额外解释。
  reference_cards_prompt_without_schema_suffix: |
    只输出一个 JSON 对象，不要使用代码块，不要输出额外解释。结构为：
    {"characters":[{"name":"...","subtitle":"...","description":"...","importance":"main|sub","details":{"role":"...","motivation":"...","conflict":"...","appearance":"...","personality":"...","abilities":"...","relationships":"..."},"character_profile":{"aliases":["..."],"portrayal_context":"...","dialogue_examples":["..."],"scene_opening_examples":["..."],"portrayal_notes":"..."},"tags":["..."]}],"locations":[{"name":"...","subtitle":"...","description":"...","importance":"main|sub","details":{"geography":"...","atmosphere":"...","function":"...","story_importance":"...","dangers":"..."},"tags":["..."]}],"items":[],"rules":[],"lores":[{"name":"...","subtitle":"...","description":"...","importance":"main|sub","details":{"category":"...","era":"...","background":"...","story_relevance":"...","related_entities":"...","uncertainties":"..."},"tags":["..."]}]}

# 分卷大纲 Prompt 配置
create_volume_outline_by_ai:
  volume_outline_prompt_base: |
    你是一位资深长篇小说结构编辑。请依据下面的小说设定，把全书 {number_of_chapters} 章
    划分为若干卷，产出分卷大纲。

    【小说设定】
    标题：{title}
    类型：{genre}
    基调：{tone}
    核心创意：{core_idea}
    故事核心：{core_seed}
    简介：{summary}
    世界观：{worldview}
    主线剧情：{plot}

    要求：
    - 卷数须同时依据总章数与剧情节奏动态确定，不要把所有篇幅固定为 3-8 卷：
      - 1-120 章：通常 3-5 卷；
      - 121-300 章：通常 5-8 卷；
      - 301-600 章：通常 8-12 卷，越接近 600 章越应靠近区间上限（600 章优先规划为 10-12 卷）；
      - 超过 600 章：原则上每 40-70 章规划一卷，通常不少于 10 卷，篇幅很长时可以超过 16 卷。
    - 每卷应对应一个完整的阶段目标、核心冲突与收束结果，并有清晰的起承转合；不要为了减少卷数而把多个独立剧情阶段硬塞进同一卷。
    - 每卷给出：卷标题、本卷剧情摘要、本卷弧线（arc）、覆盖的章节区间 chapter_range{{start,end}}。
    - **章节区间必须以全书章号连续覆盖 1..{number_of_chapters}，互不重叠、无缝隙**：
      首卷从第 1 章起，每卷 start = 上一卷 end + 1，末卷 end = {number_of_chapters}。
  volume_outline_prompt_with_schema_suffix: |
    请严格按提供的 JSON Schema 输出，volumes 数组按章序递增排列。
  volume_outline_prompt_without_schema_suffix: |
    请只输出 JSON，形如：
    {"volumes":[{"title":"第一卷 ...","summary":"...","arc":"...","chapter_range":{"start":1,"end":20}}]}
    不要输出 JSON 以外的任何内容。

# 章节细纲 Prompt 配置
create_chapter_outline_by_ai:
  contract_version: scene_transition_contract.v2
  prompt_revision: chapter-outline-prompt-r4
  chapter_outline_prompt_base: |
    你是一位资深长篇小说编辑。请为第 {chapter_order} 章《{chapter_title}》撰写章节细纲。
    本章目标字数约 {words_per_chapter} 字。

    【已知上下文】
    {context}

    {style_controls}

    要求：
    - scene_contract_version 必须精确为 scene_transition_contract.v2。
    - 整个章纲必须精炼。系统保存后形成的【本章细纲】上下文投影必须不超过
      20,000 UTF-8 bytes；请把最终 JSON 响应控制在 16,000 UTF-8 bytes 以内，
      避免同义复述，并优先保留可执行的条件、叙事拍与状态变化。
    - scenes：按真实的情节转折拆成 1-6 个语义完整场景。不得为了凑场景数或均分字数，
      把同一个连续动作、对话或因果事件从中间切开；每场都必须是可审计的状态转移合同：
      - contract_version 精确为 scene_transition_contract.v2；scene_id 在本章唯一且按叙事顺序稳定编号。
      - summary 和 purpose 保留给作者阅读。
      - preconditions / postconditions / forbidden_conditions 中每项都有本章唯一 condition_id 和可核对描述。
      - beats 把本场拆成原子叙事拍；每项给本章唯一 beat_id、description、expected_transition 和 required。
        expected_transition 必须写明这一拍使知识、关系、目标、风险、选择或情绪发生了什么变化，不能只写“提到某事”。
      - narrative_delta 每项给本章唯一 delta_id、dimension、before、after；dimension 只能为 knowledge、relationship、goal、risk、choice、emotion；before 与 after 不得同义复述。
      - event_key 使用稳定的小写事件键；repetition_policy 只能为 forbid、allow_if_escalated 或 allow。
      - word_budget 给出 min / target / max，满足 min <= target <= max；按本场必要 beats、冲突强度、转折和结果所需篇幅分配，
        不要求各场相等；所有场景 target 之和必须精确等于 target_word_count。
    - core_conflict：本章的核心冲突，一句话。
    - ending_hook：章末钩子，让读者想读下一章。
    - target_word_count：本章目标字数，接近 {words_per_chapter}。
    - 凡指向人物、伏笔的字段，**只能填上文【可用 id 名单】里出现过的 id 原文**：
      pov_character_card_id（视角人物，可为 null）、
      present_character_card_ids（本章出场人物）、
      mentioned_character_card_ids（本章被提及但不出场的人物）、
      threads_resolved（本章回收的伏笔）。
    - 【世界条目紧凑索引】中的关键词只帮助你检索，不会自动激活条目，摘要也不是条目正文。
      本章需要某条地点、物品、规则或通用世界设定时，必须把索引里的 card_id 原文
      **显式写入 referenced_worldbook_card_ids**。完整正文只会在你声明其 card_id 后
      由系统按正式 ID 装配；没有声明的条目绝不能仅因关键词出现在前文而引用。
      **不要自己编造 id**：名单之外的 id 会被系统剔除并报告给用户。
    - new_threads：本章新埋下的伏笔，每条给 name、description、due_target、
      importance（main 或 sub）。due_target 已有目标章节时用
      {{"kind":"chapter","chapter_id":"<名单中的章节 id>"}}；目标章尚未建立时用
      {{"kind":"planned_ordinal","ordinal":120}}；不确定时为 null。
      这些伏笔尚不存在于名单中，**不要为它们编 id**。
    - new_reference_card_candidates: declare only important new characters, locations,
      items, rules, or lore that do not have a formal card id yet. Record only facts
      confirmed by this outline; do not speculate or invent an internal id.
      Use card_type character, location, item, rule, or lore and include a short
      evidence_summary. Set requires_review_before_next_chapter to true only when a
      later chapter depends on this candidate becoming a formal card. One-off details
      that will not matter again should not become candidates. Existing roster entries
      must continue to use their formal ids instead of being declared again.
  chapter_outline_prompt_with_schema_suffix: |
    请严格按提供的 JSON Schema 输出。最终 JSON 响应不得超过 16,000 UTF-8 bytes，
    且保存后的【本章细纲】上下文投影不得超过 20,000 UTF-8 bytes。
  chapter_outline_prompt_without_schema_suffix: |
    请只输出 JSON，形如：
    {"scene_contract_version":"scene_transition_contract.v2","pov_character_card_id":"<名单中的id或null>","present_character_card_ids":["<名单中的id>"],"mentioned_character_card_ids":[],"referenced_worldbook_card_ids":[],"scenes":[{"contract_version":"scene_transition_contract.v2","scene_id":"scene-1","summary":"...","purpose":"...","preconditions":[{"condition_id":"scene-1-pre-1","description":"..."}],"beats":[{"beat_id":"scene-1-beat-1","description":"...","expected_transition":"...","required":true}],"postconditions":[{"condition_id":"scene-1-post-1","description":"..."}],"forbidden_conditions":[],"narrative_delta":[{"delta_id":"scene-1-delta-1","dimension":"goal","before":"尚未接受目标","after":"主动接受目标"}],"event_key":"main-goal.accepted","repetition_policy":"forbid","word_budget":{"min":800,"target":1100,"max":1500}},{"contract_version":"scene_transition_contract.v2","scene_id":"scene-2","summary":"...","purpose":"...","preconditions":[{"condition_id":"scene-2-pre-1","description":"..."}],"beats":[{"beat_id":"scene-2-beat-1","description":"...","expected_transition":"...","required":true}],"postconditions":[{"condition_id":"scene-2-post-1","description":"..."}],"forbidden_conditions":[],"narrative_delta":[{"delta_id":"scene-2-delta-1","dimension":"risk","before":"风险尚未暴露","after":"风险公开升级"}],"event_key":"main-risk.escalated","repetition_policy":"forbid","word_budget":{"min":1400,"target":1900,"max":2300}}],"core_conflict":"...","ending_hook":"...","target_word_count":3000,"threads_resolved":[],"new_threads":[],"new_reference_card_candidates":[]}
    整个 JSON 响应不得超过 16,000 UTF-8 bytes；不要输出 JSON 以外的任何内容。

# 章节正文 Prompt 配置
write_chapter_by_ai:
  chapter_content_prompt_base: |
    你是一位资深长篇小说作者。请为第 {chapter_order} 章《{chapter_title}》撰写正文。
    本章目标字数约 {words_per_chapter} 字。

    【已知上下文】
    {context}

    {style_controls}

    要求：
    - 严格按上文【本章细纲】的场景顺序推进，不要新增细纲之外的重大情节。
    - 人物的言行必须与其卡片设定、当前状态、既有永久事实一致；
      与永久事实冲突的写法（例如让已死之人正常出场）除非细纲明确要求，否则不要写。
    - 采用上文指定的叙事视角与写作风格；没有指定时用第三人称有限视角。
    - 以场景和对话推进，避免大段旁白式总结。
    - 章末收在细纲给出的钩子上。
    - 直接输出正文本身。不要写标题、不要写"第几章"、不要加任何解释或小标题。
  chapter_content_prompt_without_schema_suffix: |
    直接输出正文纯文本，不要输出 JSON，不要用代码块包裹。

# 章节正文相对细纲的语义符合度检查（批量生成门禁）
review_chapter_outline_adherence_by_ai:
  contract_version: chapter_outline_adherence_evidence.v4
  outline_adherence_prompt_base: |
    你是一位严谨但不过度机械的长篇小说责任编辑。请检查第 {chapter_order} 章
    《{chapter_title}》的正文是否在语义上落实了本章细纲，并仍然服务于当前卷大纲。

    【已知上下文】
    {context}

    【待检查正文】
    {chapter_content}

    检查维度：
    1. scenes 是否按合理顺序得到覆盖；允许合并、拆分、同义改写和必要的过渡。
    2. core_conflict 是否真正发生并得到本章应有的推进。
    3. ending_hook 是否以语义等价的方式落在章末。
    4. 是否新增了会改变人物命运、主线方向、伏笔状态或世界状态的重大情节。
    5. 是否偏离当前卷弧线，或提前完成后续阶段才应完成的目标。

    判定规则：
    - 仅当细纲是 legacy_v1 时返回 pass / warn / fail：关键场景、核心冲突和结尾钩子均落实才是 pass；
      轻微压缩或顺序微调是 warn；遗漏关键场景、核心冲突、结尾钩子，新增重大事件或偏离卷弧线是 fail。
    - 不做关键词匹配，不因正文比细纲更具体而判错，也不要为了凑问题而报告。
    - legacy_v1 的每个问题必须同时给出细纲要求和正文依据；没有可引用依据就不要报告。
    - legacy_v1 的 verdict 必须与 issues 一致：存在 error 即 fail；只有 warning 即 warn；无问题即 pass。
    - 如果细纲声明 scene_transition_contract.v2，逐个 scene_id / beat_id 返回证据，不得把整场 covered 当作 beat 已兑现。
    - beat 状态只能为 satisfied、mentioned、contradicted、missing 或 unknown。
      只出现名词、道具或一句结果，但 expected_transition 没有发生时必须用 mentioned；正文与要求相反时用 contradicted；
      完全没有证据时用 missing；无法可靠判断时用 unknown，不得猜成 satisfied。
    - satisfied、mentioned、contradicted 必须给至少一个正文 span；一个 beat 可以有多个 span，同一 span 也可支持多个 beat。
    - span 使用待检查正文的 0 起始 Unicode code-point 偏移，区间为 [start,end)，
      quote 必须逐字复制该区间原文。不得改写、去空格或使用字节偏移；系统会在本地复核后生成证据哈希。
    - Provider 只返回 beat_evidence、findings、quality_dimensions、unknowns 与 scene_quality_profiles，
      不返回 pass / warn / fail，也不决定本地 severity 或最终动作。
    - V4 findings 用于报告场景顺序、核心冲突、结尾钩子、细纲外重大事件、卷弧线偏离、
      forbidden condition 或 event repetition；observed 必须给正文 span，无法确定时用 unknown。
      forbidden_condition 必须引用同场景细纲中精确的 condition_ids；event_repetition 必须引用同场景精确的
      event_key。没有正式合同引用，或 repetition_policy 不是 forbid 时，只能作为质量观察，不得伪装成客观 finding。
    - 无法判断一项客观合同且不能由 beat/finding 的 unknown 表达时，写入 unknowns；不得猜测通过。
    - interest、pacing、character_drive、style、novelty 与 narrative_function_repetition
      只能写入 quality_dimensions，status 只可为 concern 或 strength，并提供正文 span。
      这些是尚未校准的文学质量观察，Provider 不得把它们改写成客观合同 findings。
    - scene_quality_profiles 必须按章纲场景顺序逐场且仅返回一项。每项用 1～2 个正文 span 代表本场实际发生的动作链，
      event_fingerprint 只抽象 actor_role、action、object_role 与 outcome；narrative_function 必须分别概括
      goal、conflict、turn、outcome、new_information、character_change 与 stakes_delta。
      没有明显变化时也要如实写“本场无可观察变化”，不得复制章纲计划冒充正文事实。
    - 质量画像只供本地字面、事件指纹与叙事功能三层疑似召回。Provider 不得返回相似度阈值、候选结论、
      severity、hard_gate 或是否修复；本地相似度也不能单独升级为客观合同 finding。
    - 旧章纲没有 V2 合同时，按提供的旧 Schema 返回 scene_coverage；旧结果只用于兼容读取。
  outline_adherence_prompt_with_schema_suffix: |
    请严格按提供的 JSON Schema 输出，不要输出额外解释。
  outline_adherence_prompt_without_schema_suffix: |
    只输出一个 JSON 对象，不要使用代码块，不要输出额外解释。格式：
    {"verdict":"pass|warn|fail","summary":"总体结论","scene_coverage":[{"scene_index":1,"status":"covered|partial|missing","evidence":"正文依据"}],"issues":[{"severity":"warning|error","category":"scene_coverage|scene_order|core_conflict|ending_hook|unplanned_major_event|volume_arc","outline_requirement":"细纲或卷纲要求","prose_evidence":"正文依据","explanation":"偏离原因"}]}
  outline_adherence_v4_prompt_with_schema_suffix: |
    请严格按提供的 V4 JSON Schema 输出语义证据，不要输出 verdict、severity、decision、候选结论或额外解释。
  outline_adherence_v4_prompt_without_schema_suffix: |
    只输出一个 JSON 对象，不要使用代码块，不要输出额外解释。格式：
    {"schema_version":"chapter_outline_adherence_evidence.v4","outline_contract_version":"scene_transition_contract.v2","summary":"证据摘要","beat_evidence":[{"scene_id":"scene-1","beat_id":"scene-1-beat-1","status":"satisfied|mentioned|contradicted|missing|unknown","spans":[{"start":0,"end":4,"quote":"逐字复制的正文原文"}],"explanation":"判定依据"}],"findings":[],"quality_dimensions":[],"unknowns":[],"scene_quality_profiles":[{"profile_id":"profile-scene-1","scene_id":"scene-1","representative_spans":[{"start":0,"end":4,"quote":"逐字复制的正文原文"}],"event_fingerprint":{"actor_role":"行动者角色","action":"核心动作","object_role":"作用对象角色","outcome":"事件结果"},"narrative_function":{"goal":"场景目标","conflict":"阻力或冲突","turn":"关键转折","outcome":"叙事结果","new_information":"新增信息或本场无可观察变化","character_change":"人物变化或本场无可观察变化","stakes_delta":"风险变化或本场无可观察变化"}}]}

extract_chapter_state_by_ai:
  contract_version: chapter_state_fact_evidence.v1
  chapter_state_prompt_base: |
    你是一位严谨的长篇小说编辑，负责在作者写完一章后回填记忆档案。

    请阅读第 {chapter_order} 章《{chapter_title}》（内部 chapter_id：{chapter_id}）的正文，产出五件事：
    1. 本章摘要；
    2. 出场角色的当下状态更新与新确立的永久事实；
    3. 既有伏笔的状态推进；
    4. 正文与既有永久事实的冲突报告。
    5. 一份逐字绑定正文、覆盖全部持久事实与全部状态动作的 fact_evidence。

    【已知上下文】
    {context}

    【本章正文】
    {chapter_content}

    要求：
    - 摘要控制在 200 字以内，写清本章实际发生的事，不要评论、不要剧透后文。
    - 当下状态（current_state）写角色在本章**结束时**的位置、处境、情绪、伤势，
      这是会被后续章节覆盖的信息。
    - 永久事实（permanent_facts）只写**不可逆**的既成事实：死亡、残疾、身份揭露、
      关系决裂、能力获得或永久丧失。可以痊愈的伤、会改变的情绪**不是**永久事实。
      拿不准就不写——写错了没有删除入口。
    - character_updates[].card_id 只能逐字复制上文【人物】可用 id 名单中的 id。
    - thread_updates[].thread_id 只能逐字复制上文【伏笔】可用 id 名单中的 id；
      不得使用人物、世界资料卡、章节或其他类型的 id，也不得根据名称猜测 id。
      名单中没有对应伏笔时就不要提交该条更新。
    - 伏笔只能推进为 developing（有推进但未收）或 resolved（本章确实收了）。
      不要新建伏笔，不要判定废弃。以**正文实际写了什么**为准：
      细纲计划要收的伏笔，正文可能根本没写到。
    - 一致性冲突：逐条比对本章正文与上文列出的既有永久事实。
      **回忆、幻觉、诈死、托梦、他人假扮都是合法叙事**，不要把它们报成冲突；
      只报那些看起来像是作者忘了设定的地方，并在 conflict 里写明正文依据。
      没有冲突就返回空列表，不要为了凑数而编造。
    - fact_evidence.schema_version 必须精确为 chapter_state_fact_evidence.v1。
      fact_id 在本次输出内唯一且稳定，使用小写字母、数字、点、下划线、冒号或短横线。
    - 逐项区分事实种类。canonical_fact 是后续叙事会依赖的客观持久事实；
      character_cognition 只是角色知道或相信的内容；rumor 是传闻；deception 是谎言、
      伪装或误导；temporary_fact 是位置、情绪、短期伤势等可变化状态。
      后四类不能冒充客观世界事实写入永久事实。
    - support 只描述正文是否支持该项。supported 必须有逐字正文 span；unsupported 表示
      某个候选状态动作没有正文依据，也必须给能证明其不成立或仅属误判的正文 span；
      无法可靠判断时用 unknown，绝不能把 unknown 写成 supported。
    - 每个 character_updates[].current_state 非空动作、每条 new_permanent_facts 动作、
      每条 thread_updates 动作都必须被且只被一条 fact_evidence.facts[].action_ref 精确引用。
      action_ref 的 action_type、target_id、value 和 permanent_fact_kind 必须逐字等于候选动作；
      不得用名称、别名、占位符或猜测值代替内部 ID。
    - 本章摘要也会进入后续叙事上下文。extraction_status=complete 时，必须有且只有一条
      fact_evidence 通过 action_type=chapter_summary、target_id={chapter_id}、value 等于完整
      summary 的 action_ref 核算它；正文支持时使用 supported canonical_fact，正文不支持时
      如实标为 unsupported。本地仅在既有摘要仍绑定同一正文时保留它；若本次会替换正文则
      失败关闭并要求重新生成受支持摘要。不得让摘要绕过逐动作核算。
      complete_no_change 表示候选摘要也不应写入，本地会用 no_change spans 记录 legal_no_op
      并保留既有正式摘要。
    - 章节级客观事实若已完整写入 summary，可用 action_type=chapter_summary、
      target_id={chapter_id}、value 等于完整 summary 的 action_ref 核算。正文存在会影响后文的
      客观持久变化时，不得用 complete_no_change 逃避，也不得漏掉对应事实。
    - spans 使用 Python 风格字符下标的左闭右开区间，quote 必须逐字复制正文对应区间；
      不得改写、去空格或使用字节偏移。本地会复核区间并只保存 quote 哈希。
    - extraction_status=complete 时 facts 必须非空，no_change 与 unknown_reason 必须为空；
      complete_no_change 只用于确实没有任何需核算持久变化时，facts 为空且 no_change 给出正文
      span；unknown 只用于抽取确实无法完成时，并填写 unknown_reason，不能同时给 no_change。
  chapter_state_prompt_with_schema_suffix: |
    按给定的 JSON Schema 输出。不得省略 fact_evidence，也不得输出额外解释。
  chapter_state_prompt_without_schema_suffix: |
    只输出一个 JSON 对象，不要用代码块包裹，不要加任何解释。格式：
    {"summary":"本章摘要","character_updates":[{"card_id":"卡片id","current_state":"当下状态","new_permanent_facts":[{"fact":"事实描述","kind":"death|injury|identity|relation|ability"}]}],"thread_updates":[{"thread_id":"伏笔id","status":"developing|resolved","evidence":"正文依据"}],"consistency_issues":[],"fact_evidence":{"schema_version":"chapter_state_fact_evidence.v1","extraction_status":"complete|complete_no_change|unknown","facts":[{"fact_id":"fact-1","kind":"canonical_fact|character_cognition|rumor|deception|temporary_fact","support":"supported|unsupported|unknown","statement":"事实陈述","target_type":"character|thread|chapter","target_id":"内部id或chapter时为null","action_ref":{"action_type":"chapter_summary|character_state|permanent_fact|thread_status","target_id":"精确内部id","value":"与候选动作逐字相同","permanent_fact_kind":null},"spans":[{"start":0,"end":4,"quote":"逐字正文"}],"explanation":"核算依据"}],"no_change":null,"unknown_reason":null}}
